<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{.AppID}} Diagnostics</title>
<script src="/{{.Token}}/htmx.min.js"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 640px; margin: 48px auto; color: #222; }
  h1 { font-size: 1.4em; }
  ul { list-style: none; padding: 0; }
  li { padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; }
  li.ok { background: #eafaf0; border: 1px solid #b7e4c7; }
  li.warn { background: #fff8e1; border: 1px solid #ffe58a; }
  li.fail { background: #fdecea; border: 1px solid #f5b8b3; }
  .name { font-weight: 600; }
  .detail { color: #555; font-size: 0.9em; margin-top: 4px; word-break: break-all; }
  a.button { display: inline-block; padding: 8px 20px; margin-top: 16px; margin-right: 8px; background: #0067b8; color: white; text-decoration: none; border-radius: 4px; }
</style>
</head>
<body hx-post="/{{.Token}}/heartbeat" hx-trigger="every 2s" hx-swap="none">
<h1>{{.AppID}} Diagnostics</h1>
<ul>
{{range .Checks}}
  <li class="{{.Status}}">
    <div class="name">{{.Name}}</div>
    <div class="detail">{{.Detail}}</div>
  </li>
{{end}}
</ul>
{{if .LogZipPath}}<p>Diagnostic logs saved to: <code>{{.LogZipPath}}</code></p>{{end}}
{{if .MailtoURL}}<a class="button" href="{{.MailtoURL}}">Contact Support</a>{{end}}
</body>
</html>
