{{define "layout"}}<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{.Title}} Setup</title>
<script src="/{{.Token}}/htmx.min.js"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 640px; margin: 48px auto; color: #222; }
  h1 { font-size: 1.4em; }
  .box { border: 1px solid #ccc; border-radius: 8px; padding: 24px; margin-top: 16px; }
  .error { color: #b00020; margin-bottom: 12px; }
  button { padding: 8px 20px; margin-right: 8px; margin-top: 12px; cursor: pointer; }
  input[type=text] { width: 100%; padding: 8px; margin-top: 8px; box-sizing: border-box; }
  .log { color: #666; font-size: 0.9em; }
  .log div { margin-top: 4px; }
</style>
</head>
<body hx-post="/{{.Token}}/heartbeat" hx-trigger="every 2s" hx-swap="none">
<h1>{{.Title}} Setup</h1>
<div id="content" class="box">
{{template "content" .}}
</div>
</body>
</html>
{{end}}
